services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.16
    command: [hbbs, -r, "${DESKLINK_RELAY_ADDRESS:?set DESKLINK_RELAY_ADDRESS}", -k, '_']
    ports:
      - '21115:21115/tcp'
      - '21116:21116/tcp'
      - '21116:21116/udp'
    volumes:
      - ./data:/root
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:1.1.16
    command: [hbbr, -k, '_']
    depends_on:
      - hbbs
    ports:
      - '21117:21117/tcp'
    volumes:
      - ./data:/root
    restart: unless-stopped
