name: Desktop builds

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: macos, arch: arm64 }
          - { runner: macos-15-intel, platform: macos, arch: amd64 }
          - { runner: windows-2025, platform: windows, arch: amd64 }
          - { runner: windows-11-arm, platform: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false
      - name: Verify and build
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ((go env GOARCH) -ne $env:EXPECTED_ARCH) {
            throw "Expected a native $env:EXPECTED_ARCH Go environment"
          }
          go test ./...
          go vet ./...
          $binary = if ($IsWindows) { 'desklink.exe' } else { 'desklink' }
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath '-ldflags=-s -w' -o "dist/package/$binary" .
      - name: Exercise Windows protocol dispatch
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Binary ./dist/package/desklink.exe
      - name: Package the launcher
        id: package
        shell: pwsh
        env:
          PACKAGE_NAME: desklink-${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item -Path desklink.example.json, README.md, LICENSE -Destination dist/package
          if ($IsWindows) {
            $artifact = "dist/$env:PACKAGE_NAME.zip"
            Compress-Archive -Path 'dist/package/*' -DestinationPath $artifact
          } else {
            $artifact = "dist/$env:PACKAGE_NAME.tar.gz"
            tar -czf $artifact -C dist/package desklink desklink.example.json README.md LICENSE
          }
          Set-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$artifact" -Encoding UTF8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
