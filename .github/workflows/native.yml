name: Native integration

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: upstream
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Check RustDesk integration
        run: node native/prepare.cjs upstream
      - name: Verify native account and terminal
        working-directory: native
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android-arm64:
    if: github.event_name == 'workflow_dispatch'
    needs: integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: upstream
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Prepare native integration and Android engine
        run: |
          node native/prepare.cjs upstream
          git -C "$(dirname "$(dirname "$(command -v flutter)")")" apply "$PWD/upstream/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          curl -fsSL https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-aarch64-signed.apk -o upstream-engine.apk
          printf '%s\n' '6b3aca1a7e68c3f80e5abe7ec3bea3e5ff445a03cf77131ff79a1ee4270288ff  upstream-engine.apk' | sha256sum -c
          destination=upstream/flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$destination"
          unzip -jo upstream-engine.apk 'lib/arm64-v8a/librustdesk.so' 'lib/arm64-v8a/libc++_shared.so' -d "$destination"
      - name: Generate the matching upstream Flutter bridge
        working-directory: upstream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qy --no-install-recommends clang cmake libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
          rustup toolchain install 1.75 --profile minimal --component rustfmt
          cargo +1.75 install cargo-expand --version 1.0.95 --locked
          cargo +1.75 install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          (cd flutter && flutter pub get)
          RUSTUP_TOOLCHAIN=1.75 "$HOME/.cargo/bin/flutter_rust_bridge_codegen" --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build a side-by-side Android test APK
        working-directory: upstream/flutter
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          node -e 'const fs=require("node:fs"); const file="android/app/build.gradle"; fs.writeFileSync(file,fs.readFileSync(file,"utf8").replace("applicationId \"com.carriez.flutter_hbb\"","applicationId \"com.hoemr.desklink\"").replace("signingConfig signingConfigs.release","signingConfig signingConfigs.debug")); const manifest="android/app/src/main/AndroidManifest.xml"; fs.writeFileSync(manifest,fs.readFileSync(manifest,"utf8").replace("android:label=\"RustDesk\"","android:label=\"Desklink\""));'
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../desklink-android-arm64-test.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desklink-android-arm64-test
          path: desklink-android-arm64-test.apk
          if-no-files-found: error
