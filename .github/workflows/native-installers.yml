name: Desklink host installers

'on':
  workflow_dispatch:
    inputs:
      gui_run:
        description: Run ID of a Graphical desktop builds workflow with all four GUI artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            asset: aarch64
            digest: e6d30fa1633d772c48935907c208ca4e555a856fb2038af3aaa87a327c29360b
          - runner: macos-15-intel
            architecture: x86_64
            asset: x86_64
            digest: 74d06e6b2e273a128e8d36313e30d47db2063f453a4235ed4d9e5cdfdf9be538
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      ENGINE_ASSET: ${{ matrix.asset }}
      ENGINE_SHA256: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desklink-graphical-macos-${{ matrix.architecture }}
          path: graphical
          github-token: ${{ github.token }}
          run-id: ${{ inputs.gui_run }}
      - name: Bundle the verified host helper into the installer
        run: |
          test "$(uname -m)" = "$ARCHITECTURE"
          ditto -x -k "graphical/desklink-graphical-macos-$ARCHITECTURE.zip" graphical/app
          curl -fsSL "https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-$ENGINE_ASSET.dmg" -o upstream-engine.dmg
          printf '%s  %s\n' "$ENGINE_SHA256" upstream-engine.dmg | shasum -a 256 -c
          mount="$RUNNER_TEMP/desklink-host-engine"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" upstream-engine.dmg
          trap 'hdiutil detach "$mount"' EXIT
          bash native/package-macos.sh graphical/app/Desklink.app "$mount/RustDesk.app/Contents/MacOS/service" "Desklink-macos-$ARCHITECTURE.pkg"
      - name: Check installation layout and launchd registration on the runner
        run: |
          app=/Applications/RustDesk.app
          test ! -e "$app"
          sudo installer -pkg "Desklink-macos-$ARCHITECTURE.pkg" -target /
          codesign --verify --deep --strict "$app"
          test "$("$app/Contents/MacOS/RustDesk" --version)" = 1.5.3
          sudo "$app/Contents/MacOS/service" --write-plists
          daemon=/Library/LaunchDaemons/com.carriez.RustDesk_service.plist
          agent=/Library/LaunchAgents/com.carriez.RustDesk_server.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$daemon")" = "$app/Contents/MacOS/service"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$agent")" = "$app/Contents/MacOS/RustDesk"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' "$agent")" = '--server'
          sudo launchctl bootstrap system "$daemon"
          trap 'sudo launchctl bootout system "$daemon"' EXIT
          sudo launchctl kickstart -p system/com.carriez.RustDesk_service
          sudo launchctl print system/com.carriez.RustDesk_service | python3 -c 'import sys; assert "state = running" in sys.stdin.read()'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desklink-host-macos-${{ matrix.architecture }}
          path: Desklink-macos-${{ matrix.architecture }}.pkg
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: upstream
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desklink-graphical-windows-${{ matrix.architecture }}
          path: graphical
          github-token: ${{ github.token }}
          run-id: ${{ inputs.gui_run }}
      - name: Build the one-file host installer
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "graphical/desklink-graphical-windows-$env:ARCHITECTURE.zip" -DestinationPath graphical/app
          & ./native/package-windows.ps1 -Upstream upstream -Bundle graphical/app -Architecture $env:ARCHITECTURE -Output "Desklink-windows-$env:ARCHITECTURE-install.exe"
      - name: Check service installation on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Get-Service -Name RustDesk -ErrorAction SilentlyContinue) { throw 'Expected a clean runner' }
          $config = Join-Path $env:APPDATA 'RustDesk/config'
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          @('[options]', 'custom-rendezvous-server = "127.0.0.1:9"', 'allow-auto-update = "N"') | Set-Content -LiteralPath "$config/RustDesk2.toml" -Encoding utf8
          $setup = Start-Process -FilePath "$PWD/Desklink-windows-$env:ARCHITECTURE-install.exe" -ArgumentList '--silent-install' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $service = Get-Service -Name RustDesk
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $exe = Join-Path $env:ProgramFiles 'RustDesk/rustdesk.exe'
          if ((& $exe --version | Out-String).Trim() -ne '1.5.3') { throw 'Unexpected installed version' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desklink-host-windows-${{ matrix.architecture }}
          path: Desklink-windows-${{ matrix.architecture }}-install.exe
          if-no-files-found: error
